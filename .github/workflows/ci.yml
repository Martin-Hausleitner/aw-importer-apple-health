name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Secret scan
        run: |
          ! grep -RInE 'access_token|refresh_token|client_secret|BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16}|X-Amz-Signature=' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.pytest_cache --exclude-dir=.ruff_cache
